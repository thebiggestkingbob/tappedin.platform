function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),4000)}
function modal(title,body,foot=''){const el=document.getElementById('modal');el.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" aria-label="Close dialog" onclick="closeModal()">${icon('close')}</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}`;if(!el.open)el.showModal()}
function closeModal(){document.getElementById('modal').close()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function nav(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}function openProfile(id){if(document.getElementById('modal').open)closeModal();activeProfile=id;profileTab='history';nav('profile')}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();render()}
function renderApp(){document.documentElement.dataset.theme=state.theme;const navs=[['feed','feed','Feed'],['discover','search','Discover'],...((account.profile)?[['office','brief','Office']]:[]),['profile','user',account.profile?'My profile':'Join TAPPED IN']];document.getElementById('app').innerHTML=`<header class="top"><button class="brand" aria-label="TAPPED IN feed" onclick="nav('feed')">TAPPED<span>IN</span></button><div class="topright"><button class="icon-btn" aria-label="Switch to ${state.theme==='dark'?'light':'dark'} mode" onclick="toggleTheme()">${icon(state.theme==='dark'?'sun':'moon')}</button><button class="icon-btn" aria-label="Account and settings" onclick="account.profile?nav('settings'):location.assign('/login')">${icon('user')}</button><button class="avatar" aria-label="My profile" onclick="openProfile('me')">${account.profile?initials(me().name):icon('user')}</button></div></header><div class="shell"><aside class="side">${navs.map(([v,i,l])=>`<button class="nav ${view===v?'active':''}" onclick="${v==='profile'?"openProfile('me')":`nav('${v}')`}">${icon(i)}${l}${v==='inbox'&&state.invitations.some(x=>x.status==='Pending'&&x.to==='me')?'<span class="red">●</span>':''}</button>`).join('')}${!fan()?`<button class="btn primary" onclick="startComposer()">${icon('plus')}Post to the feed</button>`:`<button class="btn primary" onclick="startOnboarding()">Join the industry</button>`}<div class="sidefoot"><button class="row" onclick="openProfile('me')">${av(me())}<span style="text-align:left"><b>${esc(me().name.split(' ')[0])}</b><small>${fan()?'Fan · here for the culture':me().roles.join(' / ')}</small></span></button><div class="divider"></div><small>ONE INDUSTRY. ONE FEED.</small><button class="text-btn muted" onclick="showAbout()">About TAPPED IN</button></div></aside><main class="main" id="main">${renderView()}</main><aside class="rail">${renderRail()}</aside></div><nav class="mobile-nav" aria-label="Main navigation">${navs.filter(x=>x[0]!=='bookings').map(([v,i,l])=>`<button class="${view===v?'active':''}" onclick="${v==='profile'?"openProfile('me')":`nav('${v}')`}">${icon(i)}${l}</button>`).join('')}${!fan()?`<button onclick="tapMenu()">${icon('plus')}Tap In +</button>`:''}</nav>`}
function renderView(){return ({feed:renderFeed,discover:renderDiscover,opportunities:renderOpportunities,profile:renderProfile,bookings:renderBookings,settings:renderSettings,inbox:renderInbox,office:renderOffice}[view]||renderFeed)()}
function sourceLinks(links,sample=false){return links.map(l=>`<a class="source" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${icon('link')}${esc(l.platform)}</a>`).join('')+(sample?'<span class="preview-note">Sample links lead to platform homepages</span>':'')}
function creditChip(c){return `<button class="credit-person" onclick="${c.id||person(c.pendingId)?`openProfile('${c.id||c.pendingId}')`:`openUnclaimedCredit('${state.posts.find(p=>p.credits?.includes(c))?.id}',${state.posts.find(p=>p.credits?.includes(c))?.credits.indexOf(c)})`}">${c.id||person(c.pendingId)?av(person(c.id||c.pendingId),'small'):''}<span>${esc(c.id?person(c.id).name:c.name)} <span class="muted">/ ${esc(c.role)}</span></span></button>`}
function basePostCard(p){const by=person(p.by);if(p.type!=='work'){const o=state.opps.find(x=>x.id===p.opp);return o?opportunityCard(o):''}return `<article class="post">${state.reposts.includes(p.id)?`<div class="repost-label">${icon('repost')} You reposted this work</div>`:''}<div class="post-head row">${av(by)}<div>${profileButton(p.by)}<div class="meta">${by.roles[0]} · ${fmt(p.date)}</div></div><span class="post-type">${esc(p.workType||'Work')}</span></div><div class="post-copy"><h3><button class="post-title" onclick="openWork('${p.id}')">${esc(p.title)}</button></h3><p>${esc(p.description)}</p></div>${artwork(p)}<div class="sources"><span class="eyebrow">One work. Every link.</span>${sourceLinks(p.links)}</div><div class="credits"><div class="row between"><div class="eyebrow">${p.credits.length} PEOPLE & PARTNERS BEHIND THIS</div><button class="text-btn" style="font-size:10px" onclick="openWork('${p.id}')">All credits</button></div><div class="credit-list">${p.credits.slice(0,3).map(creditChip).join('')}${p.credits.length>3?`<button class="tag" onclick="openWork('${p.id}')">+${p.credits.length-3} more</button>`:''}</div></div><div class="post-actions"><button class="${state.likes.includes(p.id)?'selected':''}" aria-label="Give a star to ${esc(p.title)}" aria-pressed="${state.likes.includes(p.id)}" onclick="react('likes','${p.id}')">${icon('star')}${p.likes+(state.likes.includes(p.id)?1:0)}</button><button class="${state.reposts.includes(p.id)?'selected':''}" aria-label="Repost ${esc(p.title)}" aria-pressed="${state.reposts.includes(p.id)}" onclick="react('reposts','${p.id}')">${icon('repost')}${p.reposts+(state.reposts.includes(p.id)?1:0)}</button><button aria-label="Save ${esc(p.title)}" aria-pressed="${state.saved.includes(p.id)}" class="${state.saved.includes(p.id)?'selected':''}" onclick="react('saved','${p.id}')">${icon('save')}</button><button class="detail" onclick="openWork('${p.id}')">Behind the work ${icon('arrow')}</button></div></article>`}
async function react(key,id){const i=state[key].indexOf(id);if(i>=0)state[key].splice(i,1);else state[key].push(id);await save();render();if(i<0)toast(key==='likes'?'Star given.':key==='reposts'?'Reposted to your feed.':'Saved to your feed.')}
async function toggleFollow(id){const i=state.follows.indexOf(id);if(i>=0)state.follows.splice(i,1);else state.follows.push(id);await save();render();toast(i>=0?'Unfollowed.':'Following. Their work will appear in your Following feed.')}
let unclaimedTarget=null;
function openUnclaimedCredit(pid,index){unclaimedTarget={pid,index};const c=state.posts.find(p=>p.id===pid)?.credits[index];if(c)showUnclaimed(c.name,c.role)}
function updateResults(){document.getElementById('discover-results').innerHTML=discoverResults()}
function personCard(p){return `<article class="person-card"><div class="row between">${av(p)}<span class="tag">${p.available?'Available':'Booked'}</span></div><button onclick="openProfile('${p.id}')" style="padding:0;text-align:left"><h3>${esc(p.name)}</h3></button><div class="meta">${esc(p.city)} · ${esc(p.genre)}</div><div class="row wrap gap8" style="margin-top:12px">${p.roles.map(r=>`<span class="tag">${r}</span>`).join('')}</div><p class="bio">${esc(p.bio)}</p><div class="meta">${p.socials.join(' · ')}</div><div class="row between foot"><span class="meta">${p.followers==null?'':num(p.followers)+' audience ·'} · ${p.engagement==null?'Analytics not connected':p.engagement+'% engagement'}</span><button class="text-btn ${state.follows.includes(p.id)?'muted':'red'}" onclick="toggleFollow('${p.id}')">${state.follows.includes(p.id)?'Following':'Follow +'}</button></div><button class="text-btn" style="margin-top:12px" onclick="openProfile('${p.id}')">See their work</button></article>`}
function pickTeam(id,role){const matches=state.profiles.filter(p=>p.id!=='me');modal('Find a '+esc(role),`<p class="muted">Choose a person to invite. This team belongs to your post.</p>${matches.map(p=>`<div class="social-row"><div class="row">${av(p)}<div><b>${esc(p.name)}</b><div class="meta">${p.roles.join(' / ')} · ${p.city}</div></div></div><button class="btn" onclick="inviteTeam('${id}','${esc(role)}','${p.id}')">Invite</button></div>`).join('')}`,`<button class="btn" onclick="openOpportunity('${id}')">Back to the brief</button>`)}
async function inviteTeam(id,role,pid){const o=state.opps.find(x=>x.id===id);if(o.team.some(x=>x.role===role))return toast('This role already has an invitation.');o.team.push({role,person:pid,status:'Invited'});state.invitations.push({id:uid(),post:id,to:pid,role,status:'Pending',type:'team',title:o.title});await save();openOpportunity(id);toast('Team invitation created. Track it in Inbox.')}
function renderProfile(){const p=person(activeProfile)||me(),own=p.id==='me',credited=state.posts.filter(x=>x.type==='work'&&x.credits.some(c=>c.id===p.id)).sort((a,b)=>b.date.localeCompare(a.date));return `${profileHeader(p,own,credited)}${fan()&&own?`<div class="section-label">Your ecosystem</div><div class="settings-block"><h3>${state.follows.length} people followed</h3><p>Your favourites are together in Feed Following.</p><button class="btn" onclick="feedTab='following';nav('feed')">View Following feed</button></div><button class="btn primary" onclick="startOnboarding()">Create an industry profile</button>`:`<div class="tabs">${[['history','Work history'],['moments','Moments'],['social','Social activity']].map(([v,l])=>`<button class="tab ${profileTab===v?'active':''}" onclick="profileTab='${v}';render()">${l}</button>`).join('')}${own?`<button class="tab" onclick="nav('bookings')">Private gig record ${icon('lock')}</button>`:''}</div>${profileTab==='history'?`<div class="row between" style="margin-bottom:20px"><h3>Every piece of the story.</h3>${own?`<button class="text-btn red" onclick="startComposer('work')">Add past work +</button>`:''}</div>${credited.length?`<div class="history">${credited.map(w=>`<div class="history-item"><div class="eyebrow muted">${fmt(w.date)} · ${w.date<'2026-01-01'?'ARCHIVE':'WORK'}</div><h3>${esc(w.title)}</h3><div class="row wrap gap8">${w.credits.filter(c=>c.id===p.id).map(c=>`<span class="tag">${esc(c.role)}</span>`).join('')}${w.location?`<button class="text-btn muted" onclick="openProfile('${w.location}')">${person(w.location).name}</button>`:''}</div><p class="meta" style="margin-top:10px">${w.credits.length} contributors · ${w.links.map(x=>x.platform).join(' / ')}</p><button class="btn" onclick="openWork('${w.id}')">See the work & everyone behind it</button></div>`).join('')}</div>`:`<div class="empty"><h3>The first credit is the start.</h3><p class="muted">${own?'Add a link to past work and credit your collaborators.':'Work credits will appear here as they are added.'}</p>${own?'<button class="btn primary" onclick="startComposer(\'work\')">Add your work</button>':''}</div>`}${own&&state.gigs.some(g=>g.public)?`<div class="section-label">Recorded public bookings</div>${state.gigs.filter(g=>g.public).sort((a,b)=>b.date.localeCompare(a.date)).map(g=>`<div class="work-card"><div class="row between"><h3>${esc(g.title)}</h3><span class="meta">${fmt(g.date)}</span></div><div class="meta" style="margin-top:10px">${person(g.venue)?.name||esc(g.venue)} · Completed booking</div>${g.post?`<button class="text-btn" onclick="openWork('${g.post}')">Final deliverable & everyone involved</button>`:'<p class="meta" style="margin-top:10px">Final deliverable not linked yet.</p>'}</div>`).join('')}`:''}${!own&&['Venue','Artist','DJ','Promoter'].some(r=>p.roles.includes(r))?`<div class="section-label">Public booking history</div>${credited.filter(w=>w.location===p.id||w.credits.some(c=>c.id===p.id&&/DJ|Artist/.test(c.role))).map(w=>`<div class="work-card"><div class="row between"><h3>${esc(w.title)}</h3><span class="meta">${fmt(w.date)}</span></div><div class="meta" style="margin-top:10px">${person(w.location)?.name||p.city} · Completed booking</div><button class="text-btn" onclick="openWork('${w.id}')">Final deliverable & crew</button></div>`).join('')||'<p class="muted">No public bookings recorded yet.</p>'}`:''}`:profileTab==='moments'?renderMoments(p,own):renderSocialActivity(p,own)}`}`}
function editProfile(){profilePhotoDraft=undefined;modal('Your profile, all your sides',`<div class="photo-edit">${av(me(),'large')}<div><label>Profile picture</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="stageProfilePhoto(this)"><button class="text-btn" onclick="stagePhotoRemoval()">Remove picture</button><p id="photo-save-note" role="status"></p></div></div><label>Name</label><input id="edit-name" value="${esc(me().name)}" maxlength="70"><label>Handle</label><input id="edit-handle" value="${esc(me().handle)}" maxlength="50"><label>Location</label><select id="edit-city">${options(cities,me().city)}</select><label>Bio</label><textarea id="edit-bio" maxlength="400">${esc(me().bio)}</textarea>${fan()?'':`<label>Your roles</label><div class="role-options">${roleCheckboxes(me().roles)}</div>`}<input type="hidden" id="edit-available" checked><div id="form-error" class="error"></div>`,`<span class="meta">One profile. More than one role.</span><button class="btn primary" onclick="saveProfile()">Save profile</button>`)}
function roleCheckboxes(selected){return roles.map(r=>`<label class="role-option"><input type="checkbox" name="roles" value="${r}" ${selected.includes(r)?'checked':''} onchange="limitRoles(this)">${r}</label>`).join('')}
function oldLimitRoles(el){if(document.querySelectorAll('#modal input[name=roles]:checked').length>3){el.checked=false;toast('Choose all your roles.')} }
async function saveProfile(){const name=document.getElementById('edit-name').value.trim(),selected=[...document.querySelectorAll('#modal input[name=roles]:checked')].map(x=>x.value);if(!name)return error('Add your name.');if(!fan()&&(!selected.length||selected.length>roles.length))return error('Choose at least one role.');if(profilePhotoDraft!==undefined)me().photo=profilePhotoDraft;Object.assign(me(),{name,handle:document.getElementById('edit-handle').value.trim(),city:document.getElementById('edit-city').value.trim(),bio:document.getElementById('edit-bio').value.trim(),available:document.getElementById('edit-available').checked,...(!fan()?{roles:selected}:{})});await save();closeModal();render();toast('Profile updated.')}
function editMoments(){modal('Your turning points',state.moments.map((m,i)=>`<h3 style="margin-bottom:16px">${m.title}</h3><label>What happened?</label><input id="moment-text-${i}" value="${esc(m.text)}" maxlength="150"><label>Original media URL</label><input type="url" id="moment-url-${i}" value="${esc(m.url)}"><label>Platform</label><select id="moment-platform-${i}">${platforms.map(s=>`<option ${m.platform===s?'selected':''}>${s}</option>`).join('')}</select>`).join('')+'<div id="form-error" class="error"></div>',`<span class="meta">Link media from any source.</span><button class="btn primary" onclick="saveMoments()">Save moments</button>`)}
async function saveMoments(){const next=state.moments.map((m,i)=>({...m,text:document.getElementById('moment-text-'+i).value.trim(),url:document.getElementById('moment-url-'+i).value.trim(),platform:document.getElementById('moment-platform-'+i).value}));if(next.some(m=>m.url&&!safeUrl(m.url)))return error('Use valid https:// media links.');state.moments=next;await save();closeModal();render();toast('Moments updated.')}
function renderBookings(){if(fan())return renderFeed();return `<div class="heading"><div class="eyebrow">THE WORK, AND WHAT IT PAID</div><div class="row between"><h1>Bookings<span class="red">.</span></h1><button class="btn primary" onclick="editGig()">Record a gig +</button></div><p>Your earnings stay private. Choose exactly what an agent can access.</p></div><div class="section-label">Booking requests</div>${state.requests.length?state.requests.map(b=>`<article class="booking-card"><div class="row between"><span class="eyebrow">${esc(b.status)} / ${b.to==='me'?'INCOMING':'SENT'}</span><span class="tag">${fmt(b.date)}</span></div><h3>${esc(b.title)}</h3><p>${person(b.from)?.name} ${person(b.to)?.name}<br>${person(b.location)?.name||esc(b.location)} · ${money(b.fee)} proposed fee<br>${esc(b.note)}</p><div class="row wrap gap8">${b.status==='Requested'&&b.to==='me'?`<button class="btn" onclick="shareRateCard('${b.from}')">Send rate card</button><button class="btn primary" onclick="respondBooking('${b.id}','Accepted')">Accept booking</button><button class="btn" onclick="respondBooking('${b.id}','Declined')">Decline</button>`:b.status==='Accepted'&&b.to==='me'?`<button class="btn primary" onclick="completeBooking('${b.id}')">Record completed gig</button>`:b.status==='Requested'&&b.from==='me'?`<button class="btn" onclick="respondBooking('${b.id}','Cancelled')">Cancel request</button>`:''}</div></article>`).join(''):'<div class="empty"><h3>No requests yet.</h3><p class="muted">Your booking requests will appear here.</p></div>'}<div class="row between section-label"><span>Private gig ledger ${icon('lock')}</span><button class="text-btn red" onclick="account.profile?nav('settings'):location.assign('/login')">Manage agent access</button></div><div class="social-stats"><div class="stat"><b>${state.gigs.length}</b><small>Recorded gigs</small></div><div class="stat"><b>${money(state.gigs.reduce((n,g)=>n+Number(g.amount),0))}</b><small>Total recorded fees</small></div><div class="stat"><b>${money(state.gigs.filter(g=>!g.paid).reduce((n,g)=>n+Number(g.amount),0))}</b><small>Awaiting payment</small></div></div><div class="table-wrap"><table><thead><tr><th>Gig / Venue</th><th>Date</th><th>Fee</th><th>Payment</th><th></th></tr></thead><tbody>${state.gigs.map(g=>`<tr><td><b>${esc(g.title)}</b><div class="meta">${esc(g.participation||'Job')} / ${esc(g.role||'')}${g.partOf?' / '+esc(g.partOf):''}${g.context?` / <button class="text-btn" onclick="openProject('${g.context}')">Open workspace</button>`:''}</div><div class="meta">${person(g.venue)?.name||esc(g.venue)}</div></td><td>${fmt(g.date)}</td><td>${money(g.amount)}</td><td>${g.paid?'Paid':'Unpaid'}</td><td><button class="text-btn" onclick="editGig('${g.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>${!state.gigs.length?'<p class="muted" style="padding:20px">No gigs recorded yet.</p>':''}<div class="notice">Fees never appear on your public profile or the feed. Agents can access only the records and actions you permit.</div>`}
function bookingRequest(id){if(fan())return toast('Join the industry to request bookings.');modal('Request a booking',`<div class="row" style="margin-bottom:24px">${av(person(id))}<div><b>${person(id).name}</b><div class="meta">${person(id).roles.join(' / ')}</div></div></div><label>Booking / project name</label><input id="book-title" placeholder="Name of the event or project"><div class="grid2"><div><label>Work date</label><input type="date" id="book-date"></div><div><label>Proposed fee (ZAR)</label><input type="number" id="book-fee" min="0" placeholder="6500"></div></div><label>Venue / location</label><select id="book-location">${locationOptions()}</select><label>Scope & details</label><textarea id="book-note" placeholder="Set length, deliverables, schedule, equipment…"></textarea><div id="form-error" class="error"></div>`,`<span class="meta">They can accept or decline.</span><button class="btn primary" onclick="sendBooking('${id}')">Send request</button>`)}
async function sendBooking(id){const title=document.getElementById('book-title').value.trim(),date=document.getElementById('book-date').value,fee=document.getElementById('book-fee').value,location=document.getElementById('book-location').value.trim(),note=document.getElementById('book-note').value.trim();if(!title||!date||!location||!note||fee===''||Number(fee)<0)return error('Add a title, date, location, scope and a valid fee.');if(date<new Date().toISOString().slice(0,10))return error('Choose today or a future booking date.');state.requests.push({id:uid(),from:'me',to:id,title,date,fee:Number(fee),...captureContext('booking'),event:document.getElementById('booking-event')?.value||'',paymentKind:document.getElementById('book-payment-kind')?.value||'Paid',location,note,status:'Requested'});await save();closeModal();nav('bookings');toast('Booking request sent.')}
async function respondBooking(id,status){state.requests.find(x=>x.id===id).status=status;await save();render();toast('Booking '+status.toLowerCase()+'.')}
function completeBooking(id){const b=state.requests.find(x=>x.id===id);editGig(null,b)}
function editGig(id,booking){const g=id?state.gigs.find(x=>x.id===id):booking?{title:booking.title,date:booking.date,amount:booking.fee,venue:booking.location,paid:false}:{};modal(id?'Edit private gig':'Record a private gig',`<div class="notice">Only you and agents you explicitly permit can view this record.</div><label>Gig name</label><input id="gig-title" value="${esc(g.title||'')}" placeholder="Name of the work"><div class="grid2"><div><label>Date performed</label><input type="date" id="gig-date" value="${esc(g.date||'')}"></div><div><label>Fee received / agreed (ZAR)</label><input id="gig-amount" type="number" min="0" value="${g.amount??''}"></div></div><label>Venue / location</label><select id="gig-venue">${locationOptions(g.venue)}</select><label>How were you involved?</label><select id="gig-participation" onchange="gigContextChanged()">${options(['Job','Project contribution','Team contribution','Event appearance'],g.participation||'Job')}</select><label>Your role</label><select id="gig-role">${options(roles,g.role||me().roles[0])}</select><label>Part of a project / team (optional)</label><select id="gig-context" onchange="document.getElementById('gig-partof').value=this.selectedOptions[0].dataset.title||''"><option value="">Other / not on TAPPED IN yet</option>${officeProjects.filter(p=>p.status!=='Invitation').map(p=>`<option value="${p.id}" data-title="${esc(p.title)}" ${g.context===p.id?'selected':''}>${esc(p.title)} / ${p.type==='team'?'Team':'Project'}</option>`).join('')}</select><label>Project, team or event name</label><input id="gig-partof" maxlength="120" value="${esc(g.partOf||'')}" placeholder="What were you part of?"><label>Link the work / final deliverable</label><select id="gig-post"><option value="">Choose work or paste its media link below</option>${state.posts.filter(p=>p.type==='work').map(p=>`<option value="${p.id}" ${g.post===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select><label>Or link the original media directly</label><input id="gig-work-url" type="url" value="${esc(g.workUrl||'')}" placeholder="https://…"><p class="form-help">Connect this gig to the original media and everyone credited. You can add the link later if the deliverable is still in progress.</p><label class="row"><input type="checkbox" id="gig-paid" ${g.paid?'checked':''}> Payment received</label><label class="row" style="margin-top:16px"><input type="checkbox" id="gig-public" ${g.public!==false?'checked':''}> Show booking in my public history (fee stays private)</label><div id="form-error" class="error"></div>`,`<span>${id?`<button class="text-btn red" onclick="deleteGig('${id}')">Delete record</button>`:''}</span><button class="btn primary" onclick="saveGig('${id||''}','${booking?.id||''}')">Save private record</button>`)}
async function saveGig(id,bid){const title=document.getElementById('gig-title').value.trim(),date=document.getElementById('gig-date').value,raw=document.getElementById('gig-amount').value,venue=document.getElementById('gig-venue').value.trim();if(!title||!date||raw===''||Number(raw)<0||!venue)return error('Add a gig name, date, valid fee and venue.');const post=document.getElementById('gig-post').value,workUrl=document.getElementById('gig-work-url').value.trim();if(!post&&!workUrl)return error('Link the completed work or its original media.');if(workUrl&&!safeUrl(workUrl))return error('Use an HTTPS link to the original media.');const v=state.profiles.find(p=>p.name.toLowerCase()===venue.toLowerCase());const participation=document.getElementById('gig-participation').value,partOf=document.getElementById('gig-partof').value.trim();if(participation!=='Job'&&!partOf)return error('Name the project, team or event you were part of.');const g={id:id||uid(),title,date,participation,partOf,context:document.getElementById('gig-context').value,role:document.getElementById('gig-role').value,amount:Number(raw),...captureContext('gig-link'),event:document.getElementById('gig-link-event')?.value||'',paymentKind:document.getElementById('gig-payment-kind')?.value||'Paid',venue:v?.id||venue,post,workUrl,paid:document.getElementById('gig-paid').checked,public:document.getElementById('gig-public').checked};if(id)state.gigs[state.gigs.findIndex(x=>x.id===id)]=g;else state.gigs.push(g);if(bid)state.requests.find(x=>x.id===bid).status='Completed';await save();closeModal();render();toast('Private gig record saved.')}
function deleteGig(id){modal('Delete this gig record?',`<p>The private fee and payment record will be removed. Linked public work remains in your history.</p>`,`<button class="btn" onclick="editGig('${id}')">Keep record</button><button class="btn primary" onclick="state.gigs=state.gigs.filter(g=>g.id!=='${id}');save();closeModal();render();toast('Record deleted.')">Delete record</button>`)}
function connectSocial(s){modal('Link your '+esc(s),`<label>Your ${esc(s)} profile URL</label><input id="social-url" type="url" placeholder="https://…"><div class="notice">Save your public profile link. Authorised analytics connections will be available separately.</div><div id="form-error" class="error"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSocial('${s}')">Save profile link</button>`)}
function safeUrl(s){try{const u=new URL(s);return u.protocol==='https:'&&!!u.hostname}catch{return false}}
async function saveSocial(s){const url=document.getElementById('social-url').value.trim();if(!safeUrl(url))return error('Add a valid https:// profile URL.');state.socialLinks=state.socialLinks.filter(x=>x.platform!==s);state.socialLinks.push({platform:s,url});if(!me().socials.includes(s))me().socials.push(s);await save();closeModal();render();toast('Social profile linked.')}
async function disconnectSocial(s){state.socialLinks=state.socialLinks.filter(x=>x.platform!==s);await save();render();toast('Profile link removed.')}
async function revokeAccess(id){state.permissions=state.permissions.filter(p=>p.id!==id);await save();render();toast('Agent access revoked.')}
function error(msg){const el=document.getElementById('form-error');if(el)el.textContent=msg;else toast(msg)}
function startComposer(type){if(fan())return startOnboarding();composerData={type:type||'work',title:'',description:'',date:'',location:'',city:me().city,budget:'',deadline:'',links:[{platform:'YouTube',url:''}],credits:[{person:'me',role:me().roles[0]}],teamRoles:[]};composerStep=type?1:0;drawComposer()}
function drawComposer(){const d=composerData;const steps=['Post type','The work','The people','Review'];let body=`<div class="steps">${steps.map((s,i)=>`<span class="${i===composerStep?'active':''}">${i+1}. ${s}</span>`).join('')}</div>`;
if(composerStep===0)body+=`<h3>What are you bringing to the feed?</h3><p class="muted" style="margin:8px 0 20px">The work already exists. Connect it to the people behind it.</p>${[['work','Show the work','Past or present. Link the original media and give everyone credit.'],['collab','Start a collaboration','Find people to make something together. Build your team in the post.'],['brief','Post a brief or gig','Share the scope, budget and open roles. Build the team as people apply.']].map(([t,l,s])=>`<button class="type-choice ${d.type===t?'chosen':''}" onclick="composerData.type='${t}';drawComposer()"><b>${l}</b><small>${s}</small></button>`).join('')}`;
if(composerStep===1)body+=`<label>${d.type==='work'?'Work title':'Opportunity title'}</label><input id="compose-title" maxlength="100" value="${esc(d.title)}" placeholder="What’s the work called?"><label>${d.type==='work'?'The story behind the work':'Scope & deliverables'}</label><textarea id="compose-description" maxlength="1200" placeholder="Give the work some context…">${esc(d.description)}</textarea><div class="grid2"><div><label>${d.type==='work'?'Original work date':'Work / project date'}</label><input id="compose-date" type="date" value="${d.date}"></div><div><label>${d.type==='work'?'Venue / location':'City'}</label>${d.type==='work'?`<select id="compose-location"><option value="">No location / remote</option>${state.profiles.filter(p=>p.roles.includes('Venue')).map(p=>`<option value="${p.id}" ${d.location===p.id?'selected':''}>${p.name} — ${p.city}</option>`).join('')}</select>`:`<input id="compose-city" value="${esc(d.city)}">`}</div></div>${d.type==='work'?`<label>Original media links</label><p class="form-help" style="margin-top:0">Bring YouTube, Instagram, TikTok and any other source into one post.</p><div id="compose-links">${d.links.map(linkRow).join('')}</div><button class="text-btn red" onclick="captureComposer();composerData.links.push({platform:'Instagram',url:''});drawComposer()">Add another source +</button>`:`<div class="grid2"><div><label>Total budget (ZAR)</label><input id="compose-budget" type="number" min="0" value="${d.budget}" placeholder="0 for unpaid collaboration"></div><div><label>Applications close</label><input id="compose-deadline" type="date" value="${d.deadline}"></div></div><p class="form-help">0 clearly labels this as an unpaid collaboration.</p>`}<div id="form-error" class="error"></div>`;
if(composerStep===2)body+=d.type==='work'?`<h3>Give everyone their credit.</h3><p class="muted" style="margin:8px 0 20px">Talent, crew, BTS, brands, suppliers, and the location. No contribution is too small.</p><div id="compose-credits">${d.credits.map(creditRow).join('')}</div><button class="text-btn red" onclick="captureComposer();composerData.credits.push({person:'',role:''});drawComposer()">Add a contributor +</button><div class="notice">Registered collaborators get a credit invitation to accept or decline. For people without an account, add their name and the credit stays available to claim.</div><div class="section-label">Team builder / next chapter</div><p class="muted" style="margin-bottom:14px;font-size:12px">Need people for a follow-up? Add open roles to attach a team builder to this work.</p><div class="role-options">${roles.map(r=>`<label class="role-option"><input type="checkbox" name="team-role" value="${r}" ${d.teamRoles.includes(r)?'checked':''}>${r}</label>`).join('')}</div><div id="form-error" class="error"></div>`:`<h3>Build the team inside the post.</h3><p class="muted" style="margin:8px 0 20px">Select the roles you’re looking for. Invite people from Discover, or let them apply.</p><div class="role-options">${roles.map(r=>`<label class="role-option"><input type="checkbox" name="team-role" value="${r}" ${d.teamRoles.includes(r)?'checked':''}>${r}</label>`).join('')}</div><div id="form-error" class="error"></div>`;
if(composerStep===3)body+=`<div class="eyebrow red">${d.type==='work'?'WORK / '+(d.date<'2026-01-01'?'ARCHIVE':'CURRENT'):d.type==='brief'?'OPEN BRIEF':'COLLABORATION'}</div><h2 style="margin:12px 0">${esc(d.title)}</h2><p class="muted">${esc(d.description)}</p><div class="divider"></div><div class="row between"><span>${fmt(d.date)}</span><span class="meta">${d.type==='work'?person(d.location)?.name||'Remote / no location':esc(d.city)}</span></div>${d.type==='work'?`<div class="section-label">Original sources</div><div class="row wrap">${sourceLinks(d.links)}</div><div class="section-label">Credits</div>${d.credits.map(c=>`<div class="social-row"><b>${esc(c.person==='unlisted'?c.name:person(c.person)?.name)}</b><span class="meta">${esc(c.role)}${c.person!=='me'?' · Pending confirmation':''}</span></div>`).join('')}`:`<div class="notice">${Number(d.budget)?money(Number(d.budget))+' total budget':'Unpaid collaboration'} · Applications close ${fmt(d.deadline)}</div>`}${d.teamRoles.length?`<div class="section-label">Open team roles</div><div class="row wrap gap8">${d.teamRoles.map(r=>`<span class="tag">${r}</span>`).join('')}</div>`:''}<div class="notice">${d.type==='work'?'Your contribution enters your work history. The original media stays where it was published.':'This post appears in the feed and Opportunities. Your team builder stays attached to it.'} This is saved locally in the prototype.</div>`;
modal('Post to the ecosystem',body,`<button class="btn" onclick="composerBack()">${composerStep===0?'Cancel':'Back'}</button><button class="btn primary" onclick="composerNext()">${composerStep===3?'Publish post':'Continue'}</button>`)}
function editPost(id){const p=state.posts.find(p=>p.id===id&&p.by==='me'),o=state.opps.find(o=>o.id===id&&o.by==='me');if(!p&&!o)return;const x=p||o;composerData={id:x.id,type:x.type,title:x.title,description:x.description,date:x.date,location:x.location||'',city:x.city||me().city,budget:x.budget??'',deadline:x.deadline||'',links:structuredClone(x.links||[{platform:'YouTube',url:''}]),credits:p?p.credits.map(c=>({person:c.id||c.pendingId||'unlisted',name:c.name||'',role:c.role,confirmed:!!c.id})):[],teamRoles:o?[...o.roles]:p.teamOpp?[...state.opps.find(o=>o.id===p.teamOpp).roles]:[]};composerStep=1;drawComposer()}
function deletePost(id){modal('Delete this work post?',`<p>This removes the local post and its public credits. Your private gig records remain saved.</p>`,`<button class="btn" onclick="openWork('${id}')">Keep work</button><button class="btn primary" onclick="confirmDeletePost('${id}')">Delete post</button>`)}
async function confirmDeletePost(id){const p=state.posts.find(p=>p.id===id);if(!p||p.by!=='me')return;state.posts=state.posts.filter(p=>p.id!==id);state.opps=state.opps.filter(o=>o.work!==id);state.invitations=state.invitations.filter(i=>i.post!==id);for(const key of ['likes','reposts','saved'])state[key]=state[key].filter(v=>v!==id);state.gigs.forEach(g=>{if(g.post===id)g.post=''});await save();closeModal();render();toast('Work post deleted. Private gig records kept.')}
function linkRow(l,i){return `<div class="link-row"><select aria-label="Source platform ${i+1}" data-platform="${i}">${platforms.map(s=>`<option ${l.platform===s?'selected':''}>${s}</option>`).join('')}</select><input aria-label="Source URL ${i+1}" type="url" data-link="${i}" value="${esc(l.url)}" placeholder="https://…"><button type="button" aria-label="Remove source ${i+1}" onclick="captureComposer();composerData.links.splice(${i},1);drawComposer()">${icon('close')}</button></div>`}
function creditRow(c,i){return `<div class="credit-row"><select data-person="${i}" aria-label="Contributor ${i+1}" onchange="captureComposer();drawComposer()"><option value="">Select contributor</option>${state.profiles.map(p=>`<option value="${p.id}" ${c.person===p.id?'selected':''}>${p.name}</option>`).join('')}<option value="unlisted" ${c.person==='unlisted'?'selected':''}>Someone not on the platform</option></select><input data-credit-role="${i}" aria-label="Credit role ${i+1}" value="${esc(c.role)}" placeholder="Their contribution / role"><button aria-label="Remove credit ${i+1}" onclick="captureComposer();composerData.credits.splice(${i},1);drawComposer()">${icon('close')}</button></div>${c.person==='unlisted'?`<input data-credit-name="${i}" aria-label="Unlisted contributor name" value="${esc(c.name||'')}" placeholder="Their name / business name">`:''}`}
function captureComposer(){const d=composerData;const value=id=>document.getElementById(id)?.value;if(composerStep===1){for(const [key,id] of [['title','compose-title'],['description','compose-description'],['date','compose-date'],['location','compose-location'],['city','compose-city'],['budget','compose-budget'],['deadline','compose-deadline']])if(value(id)!==undefined)d[key]=value(id);if(d.type==='work')d.links=d.links.map((l,i)=>({platform:document.querySelector(`[data-platform="${i}"]`)?.value||l.platform,url:document.querySelector(`[data-link="${i}"]`)?.value.trim()||''}))}if(composerStep===2){if(d.type==='work')d.credits=d.credits.map((c,i)=>({person:document.querySelector(`[data-person="${i}"]`)?.value||'',role:document.querySelector(`[data-credit-role="${i}"]`)?.value.trim()||'',name:document.querySelector(`[data-credit-name="${i}"]`)?.value.trim()||c.name||'',confirmed:c.confirmed&&document.querySelector(`[data-person="${i}"]`)?.value===c.person&&document.querySelector(`[data-credit-role="${i}"]`)?.value.trim()===c.role}));d.teamRoles=[...document.querySelectorAll('input[name=team-role]:checked')].map(x=>x.value)}}
function composerBack(){captureComposer();if(composerStep===0)closeModal();else{composerStep--;drawComposer()}}
function composerNext(){captureComposer();const d=composerData;if(composerStep===1){if(!d.title.trim()||!d.description.trim()||!d.date)return error('Add a title, context and work date.');if(d.type==='work'){if(!d.links.length||d.links.some(l=>!safeUrl(l.url)))return error('Add at least one valid https:// original media link.');if(d.date>new Date().toISOString().slice(0,10))return error('For completed work, choose today or a past date.');}else{if(!d.city.trim()||!d.deadline||d.budget===''||Number(d.budget)<0)return error('Add a city, valid budget and application deadline.');if(d.deadline>d.date)return error('Applications must close on or before the project date.');if(d.deadline<new Date().toISOString().slice(0,10))return error('Choose today or a future application deadline.')}}if(composerStep===2){if(d.type==='work'&&(!d.credits.length||d.credits.some(c=>!c.person||!c.role||c.person==='unlisted'&&!c.name)))return error('Give every contributor a name and a role.');if(d.type!=='work'&&!d.teamRoles.length)return error('Select at least one open team role.')}if(composerStep===3)return publishComposer();composerStep++;drawComposer()}
async function publishComposer(){const d=composerData,id=d.id||uid(),previous=state.posts.find(p=>p.id===id),existingOpp=state.opps.find(o=>o.id===id);if(d.id){state.posts=state.posts.filter(p=>p.id!==id);state.invitations=state.invitations.filter(i=>i.post!==id||i.status!=='Pending')}if(d.type==='work'){const credits=d.credits.map(c=>c.person==='me'||c.confirmed?{id:c.person,role:c.role}:c.person==='unlisted'?{name:c.name,role:c.role}:{pendingId:c.person,name:person(c.person).name,role:c.role});if(d.location&&!credits.some(c=>c.id===d.location||c.pendingId===d.location))credits.push({pendingId:d.location,name:person(d.location).name,role:'Location'});state.posts.unshift({id,by:'me',type:'work',title:d.title.trim(),description:d.description.trim(),date:d.date,location:d.location,links:d.links,credits,likes:previous?.likes||0,reposts:previous?.reposts||0,art:d.date<'2026-01-01'?'archive':'stage'});for(const c of credits)if(c.pendingId)state.invitations.push({id:uid(),post:id,to:c.pendingId,role:c.role,status:'Pending',type:'credit',title:d.title});if(previous?.teamOpp)state.opps=state.opps.filter(o=>o.id!==previous.teamOpp);if(d.teamRoles.length){const oid=previous?.teamOpp||uid();state.opps.unshift({id:oid,by:'me',type:'collab',title:d.title+' — next chapter',description:d.description,city:me().city,date:new Date(Date.now()+30*86400000).toISOString().slice(0,10),deadline:new Date(Date.now()+21*86400000).toISOString().slice(0,10),budget:0,roles:d.teamRoles,team:[],work:id});state.posts[0].teamOpp=oid}}else{state.opps=state.opps.filter(o=>o.id!==id);state.opps.unshift({id,by:'me',type:d.type,title:d.title.trim(),description:d.description.trim(),city:d.city.trim(),date:d.date,deadline:d.deadline,budget:Number(d.budget),roles:d.teamRoles,team:existingOpp?.team.filter(t=>d.teamRoles.includes(t.role))||[]});state.posts=state.posts.filter(p=>p.opp!==id);state.posts.unshift({id:uid(),by:'me',type:d.type,opp:id})}await save();closeModal();feedTab='all';nav('feed');toast(d.id?'Post updated.':'Posted. Your work and people are connected.')}
let onboardingDraft;

</script></body></html>
